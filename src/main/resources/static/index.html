<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Summarizer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Text Summarizer</h1>
      <p class="sub">Paste your text and get a short summary instantly.</p>

      <label for="text">Input Text</label>
      <textarea id="text" placeholder="Paste long text here..."></textarea>

      <div class="controls">
        <label for="sentences">Summary Sentences</label>
        <input id="sentences" type="number" min="1" max="10" value="3" />
        <button id="summarizeBtn">Summarize</button>
      </div>

      <h2>Summary</h2>
      <pre id="output">Your summary will appear here.</pre>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
